# Enhanced mainsail.cfg for Mainsail UI (recommended)
# - enables UI features, provides safe PAUSE/RESUME/CANCEL macros
# - copy the _CLIENT_VARIABLE block into your printer.cfg to customize

[mainsail]
display_status: True
virtual_sdcard: True
pause_resume: True

[gcode_macro PAUSE]
gcode:
  - M83
  - G1 E-5 F300 ; retract slightly
  - SAVE_GCODE_STATE NAME=PAUSE_state
  - G91
  - G1 Z10 F3000 ; lift Z by 10mm
  - G90
  - G1 X0 Y200 F6000 ; park position - adjust for your machine

[gcode_macro RESUME]
gcode:
  - RESTORE_GCODE_STATE NAME=PAUSE_state
  - G1 F3000

[gcode_macro CANCEL_PRINT]
gcode:
  - M104 S0
  - M140 S0
  - CANCEL_PRINT

# Client customization macro - copy this block into your printer.cfg and
# uncomment variables you want to change. Leave the final `gcode:` line.
[gcode_macro _CLIENT_VARIABLE]
#variable_use_custom_pos:  False
#variable_custom_park_x:   0.0
#variable_custom_park_y:   200.0
#variable_custom_park_dz:  10.0
#variable_retract: 5.0
#variable_unretract: 1.0
#variable_speed_retract: 35.0
#variable_speed_unretract: 35.0
#variable_use_fw_retract: False
#variable_park_at_cancel: False
#variable_runout_sensor: ""
#variable_user_pause_macro:  ""
#variable_user_resume_macro: ""
#variable_user_cancel_macro: ""
gcode:
